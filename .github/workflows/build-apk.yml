name: Build Japnish Paints APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: japnish-paints-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # JAVA 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # CHECK JAPNISH PAINTS ICON
      # ==========================================
      - name: Verify Japnish Paints icon
        shell: bash
        run: |
          if [ ! -s "JapnishPaints_ICON_FINAL.png" ]; then
            echo "ERROR: JapnishPaints_ICON_FINAL.png not found."
            exit 1
          fi

          echo "Japnish Paints icon found."


      # ==========================================
      # CREATE ANDROID DIRECTORIES
      # ==========================================
      - name: Create Android directories
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/japnishpaints/app

          mkdir -p android/app/src/main/res/drawable-nodpi

          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/xml


      # ==========================================
      # INSTALL JAPNISH PAINTS LOGO
      # ==========================================
      - name: Install Japnish Paints logo
        shell: bash
        run: |
          cp "JapnishPaints_ICON_FINAL.png" \
            android/app/src/main/res/drawable-nodpi/japnish_logo.png


      # ==========================================
      # CREATE LAUNCHER ICONS
      # ==========================================
      - name: Create launcher icons
        shell: bash
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi
          do
            cp "JapnishPaints_ICON_FINAL.png" \
              "android/app/src/main/res/mipmap-${density}/ic_launcher.png"

            cp "JapnishPaints_ICON_FINAL.png" \
              "android/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done


      # ==========================================
      # SETTINGS GRADLE
      # ==========================================
      - name: Create settings.gradle
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "JapnishPaints"

          include(":app")

          project(":app").projectDir = file("android/app")
          EOF


      # ==========================================
      # GRADLE PROPERTIES
      # ==========================================
      - name: Create gradle.properties
        shell: bash
        run: |
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF


      # ==========================================
      # ROOT BUILD GRADLE
      # ==========================================
      - name: Create root build.gradle
        shell: bash
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF


      # ==========================================
      # APP BUILD GRADLE
      # ==========================================
      - name: Create app build.gradle
        shell: bash
        run: |
          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.japnishpaints.app'

              compileSdk 35

              defaultConfig {
                  applicationId 'com.japnishpaints.app'

                  minSdk 23
                  targetSdk 35

                  versionCode 74
                  versionName '74.0.0'
              }

              signingConfigs {
                  release {
                      storeFile file(
                          "${System.getenv("GITHUB_WORKSPACE")}/japnishpaints-release-v2.jks"
                      )

                      storePassword System.getenv("JP_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("JP_KEY_ALIAS")
                      keyPassword System.getenv("JP_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
          }

          configurations.configureEach {
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"

              resolutionStrategy.eachDependency { details ->
                  if (details.requested.group == "org.jetbrains.kotlin") {
                      details.useVersion "1.8.22"
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.webkit:webkit:1.12.1'

              implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
          }
          EOF


      # ==========================================
      # ANDROID MANIFEST
      # ==========================================
      - name: Create AndroidManifest.xml
        shell: bash
        run: |
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <uses-permission
                  android:name="android.permission.CAMERA" />

              <uses-permission
                  android:name="android.permission.REQUEST_INSTALL_PACKAGES" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="Japnish Paints"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:usesCleartextTraffic="false">

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.japnishpaints.app.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # ==========================================
      # APP THEME
      # ==========================================
      - name: Create Android app theme
        shell: bash
        run: |
          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:colorAccent">#1677FF</item>

                  <item name="android:windowLightStatusBar">true</item>

              </style>

          </resources>
          EOF


      # ==========================================
      # FILE PROVIDER PATHS
      # ==========================================
      - name: Create FileProvider paths
        shell: bash
        run: |
          cat > android/app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-files-path
                  name="external_files"
                  path="." />
          </paths>
          EOF


      # ==========================================
      # MAIN ACTIVITY
      # ==========================================
      - name: Create MainActivity and APK update bridge
        shell: bash
        run: |
          cat > android/app/src/main/java/com/japnishpaints/app/MainActivity.java <<'EOF'
          package com.japnishpaints.app;

          import android.Manifest;
          import android.app.Activity;
          import android.app.DownloadManager;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.Settings;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private static final int CAMERA_PERMISSION_REQUEST = 1001;
              private static final int INSTALL_PERMISSION_REQUEST = 1002;

              private WebView webView;
              private PermissionRequest pendingPermissionRequest;
              private DownloadManager downloadManager;
              private long updateDownloadId = -1L;
              private String pendingApkUrl = "";

              private final BroadcastReceiver downloadReceiver = new BroadcastReceiver() {
                  @Override
                  public void onReceive(Context context, Intent intent) {
                      if (!DownloadManager.ACTION_DOWNLOAD_COMPLETE.equals(intent.getAction())) {
                          return;
                      }

                      long id = intent.getLongExtra(DownloadManager.EXTRA_DOWNLOAD_ID, -1L);
                      if (id != updateDownloadId) {
                          return;
                      }

                      installDownloadedApk(id);
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  downloadManager = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.addJavascriptInterface(new AndroidBridge(), "Android");

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> {
                              if (request == null) return;

                              if (checkSelfPermission(Manifest.permission.CAMERA)
                                      == PackageManager.PERMISSION_GRANTED) {
                                  request.grant(new String[] {
                                      PermissionRequest.RESOURCE_VIDEO_CAPTURE
                                  });
                              } else {
                                  pendingPermissionRequest = request;
                                  requestCameraPermission();
                              }
                          });
                      }
                  });

                  registerUpdateReceiver();
                  requestCameraPermission();

                  webView.loadUrl("https://japnishpaints.store/mobile/index.html");
              }

              private void registerUpdateReceiver() {
                  IntentFilter filter = new IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(downloadReceiver, filter, Context.RECEIVER_EXPORTED);
                  } else {
                      registerReceiver(downloadReceiver, filter);
                  }
              }

              private void requestCameraPermission() {
                  if (checkSelfPermission(Manifest.permission.CAMERA)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                          new String[] { Manifest.permission.CAMERA },
                          CAMERA_PERMISSION_REQUEST
                      );
                  }
              }

              private void requestInstallPermission() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                          && !getPackageManager().canRequestPackageInstalls()) {
                      try {
                          Intent settingsIntent = new Intent(
                              Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                              Uri.parse("package:" + getPackageName())
                          );
                          startActivityForResult(settingsIntent, INSTALL_PERMISSION_REQUEST);
                          return;
                      } catch (Exception ignored) {
                      }
                  }

                  if (updateDownloadId != -1L) {
                      installDownloadedApk(updateDownloadId);
                  }
              }

              @JavascriptInterface
              public void downloadAndInstallApk(final String url) {
                  runOnUiThread(() -> startApkDownload(url));
              }

              @JavascriptInterface
              public void openExternal(final String url) {
                  downloadAndInstallApk(url);
              }

              private void startApkDownload(String url) {
                  if (url == null || url.trim().isEmpty()) {
                      return;
                  }

                  try {
                      Uri uri = Uri.parse(url);

                      DownloadManager.Request request = new DownloadManager.Request(uri);
                      request.setTitle("Japnish Paints update");
                      request.setDescription("Downloading the latest Japnish Paints APK");
                      request.setMimeType("application/vnd.android.package-archive");
                      request.setNotificationVisibility(
                          DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED
                      );
                      request.setAllowedOverMetered(true);
                      request.setAllowedOverRoaming(true);
                      request.setDestinationInExternalFilesDir(
                          this,
                          Environment.DIRECTORY_DOWNLOADS,
                          "JapnishPaints-update.apk"
                      );

                      updateDownloadId = downloadManager.enqueue(request);
                      pendingApkUrl = url;
                  } catch (Exception e) {
                      try {
                          Intent browser = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                          startActivity(browser);
                      } catch (Exception ignored) {
                      }
                  }
              }

              private void installDownloadedApk(long downloadId) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                          && !getPackageManager().canRequestPackageInstalls()) {
                      requestInstallPermission();
                      return;
                  }

                  try {
                      Uri apkUri = downloadManager.getUriForDownloadedFile(downloadId);
                      if (apkUri == null) {
                          return;
                      }

                      Intent install = new Intent(Intent.ACTION_VIEW);
                      install.setDataAndType(
                          apkUri,
                          "application/vnd.android.package-archive"
                      );
                      install.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      install.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      install.addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION);
                      startActivity(install);
                  } catch (Exception e) {
                      try {
                          Intent browser = new Intent(Intent.ACTION_VIEW, Uri.parse(pendingApkUrl));
                          startActivity(browser);
                      } catch (Exception ignored) {
                      }
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode == INSTALL_PERMISSION_REQUEST) {
                      if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O
                              || getPackageManager().canRequestPackageInstalls()) {
                          if (updateDownloadId != -1L) {
                              installDownloadedApk(updateDownloadId);
                          }
                      }
                  }
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      String[] permissions,
                      int[] grantResults) {

                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);

                  if (requestCode == CAMERA_PERMISSION_REQUEST) {
                      if (grantResults.length > 0
                              && grantResults[0] == PackageManager.PERMISSION_GRANTED) {

                          if (pendingPermissionRequest != null) {
                              pendingPermissionRequest.grant(new String[] {
                                  PermissionRequest.RESOURCE_VIDEO_CAPTURE
                              });
                              pendingPermissionRequest = null;
                          } else {
                              webView.reload();
                          }
                      } else {
                          pendingPermissionRequest = null;
                      }
                  }
              }

              @Override
              protected void onDestroy() {
                  try {
                      unregisterReceiver(downloadReceiver);
                  } catch (Exception ignored) {
                  }

                  if (webView != null) {
                      webView.removeJavascriptInterface("Android");
                      webView.destroy();
                  }

                  super.onDestroy();
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              private class AndroidBridge {
                  @JavascriptInterface
                  public void downloadAndInstallApk(String url) {
                      MainActivity.this.downloadAndInstallApk(url);
                  }

                  @JavascriptInterface
                  public void openExternal(String url) {
                      MainActivity.this.openExternal(url);
                  }
              }
          }
          EOF


      # ==========================================
      # RESTORE SIGNING KEY
      # ==========================================
      - name: Restore signing keystore
        shell: bash
        env:
          JP_KEYSTORE_B64: ${{ secrets.JP_KEYSTORE_B64 }}
          JP_KEYSTORE_PASSWORD: ${{ secrets.JP_KEYSTORE_PASSWORD }}

        run: |
          KEYSTORE_PATH="$GITHUB_WORKSPACE/japnishpaints-release-v2.jks"

          if [ -z "$JP_KEYSTORE_B64" ]; then
            echo "ERROR: JP_KEYSTORE_B64 secret is missing."
            exit 1
          fi

          printf '%s' "$JP_KEYSTORE_B64" \
            | tr -d '[:space:]' \
            | base64 --decode --ignore-garbage \
            > "$KEYSTORE_PATH"

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "ERROR: Keystore file is empty."
            exit 1
          fi

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$JP_KEYSTORE_PASSWORD" \
            -alias "${{ secrets.JP_KEY_ALIAS }}" \
            > /dev/null

          echo "Keystore restored successfully."


      # ==========================================
      # SETUP GRADLE
      # ==========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      # ==========================================
      # GENERATE GRADLE WRAPPER
      # ==========================================
      - name: Generate Gradle wrapper
        shell: bash
        run: |
          gradle wrapper \
            --gradle-version 8.9 \
            --distribution-type bin


      # ==========================================
      # BUILD SIGNED RELEASE APK
      # ==========================================
      - name: Build signed Release APK
        env:
          JP_KEYSTORE_PASSWORD: ${{ secrets.JP_KEYSTORE_PASSWORD }}
          JP_KEY_ALIAS: ${{ secrets.JP_KEY_ALIAS }}
          JP_KEY_PASSWORD: ${{ secrets.JP_KEY_PASSWORD }}

        run: |
          chmod +x ./gradlew

          ./gradlew clean assembleRelease --stacktrace


      # ==========================================
      # VERIFY APK
      # ==========================================
      - name: Verify APK
        shell: bash
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          ls -lh "$APK_PATH"

          echo "Japnish Paints v74 APK generated successfully."


      # ==========================================
      # UPLOAD APK ARTIFACT
      # ==========================================
      - name: Upload Japnish Paints v74 APK
        uses: actions/upload-artifact@v4

        with:
          name: JapnishPaints-release-v74
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
