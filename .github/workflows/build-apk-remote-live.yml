name: Japnish Paints Live APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/japnishpaints/live
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/app/src/main/res/values

          test -s app-logo/ic_launcher.png

          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp app-logo/ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp app-logo/ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
          done

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JapnishPaintsLive"
          include(":app")
          project(":app").projectDir = file("android/app")
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.japnishpaints.live'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.japnishpaints.live'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
              }

              signingConfigs {
                  release {
                      storeFile file("${System.getenv('GITHUB_WORKSPACE')}/japnishpaints-release-v2.jks")
                      storePassword System.getenv('JP_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('JP_KEY_ALIAS')
                      keyPassword System.getenv('JP_KEY_PASSWORD')
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="Japnish Paints"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:usesCleartextTraffic="false"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#129B63</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
              </style>
          </resources>
          EOF

      - name: Create MainActivity
        shell: bash
        run: |
          cat > android/app/src/main/java/com/japnishpaints/live/MainActivity.java <<'EOF'
          package com.japnishpaints.live;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private static final int CAMERA_PERMISSION_REQUEST = 1001;
              private static final String LIVE_URL =
                  "https://japnishpaints.store/mobile/index.html";

              private WebView webView;
              private PermissionRequest pendingPermissionRequest;
              private boolean firstResume = true;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setCacheMode(WebSettings.LOAD_NO_CACHE);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setSupportZoom(false);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view, WebResourceRequest request) {
                          return handleUrl(request.getUrl());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view, String url) {
                          return handleUrl(Uri.parse(url));
                      }
                  });

                  webView.setDownloadListener(
                      (url, userAgent, contentDisposition, mimeType, contentLength) -> {
                          if (url != null && url.toLowerCase().contains(".apk")) {
                              openApkExternal(Uri.parse(url));
                          }
                      });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> {
                              if (request == null) return;

                              if (checkSelfPermission(Manifest.permission.CAMERA)
                                      == PackageManager.PERMISSION_GRANTED) {
                                  request.grant(new String[]{
                                      PermissionRequest.RESOURCE_VIDEO_CAPTURE
                                  });
                              } else {
                                  pendingPermissionRequest = request;
                                  requestPermissions(
                                      new String[]{Manifest.permission.CAMERA},
                                      CAMERA_PERMISSION_REQUEST
                                  );
                              }
                          });
                      }
                  });

                  webView.clearCache(true);
                  webView.clearHistory();
                  webView.loadUrl(LIVE_URL);
              }

              private boolean handleUrl(Uri uri) {
                  String url = uri.toString();

                  if (url.toLowerCase().contains(".apk")) {
                      openApkExternal(uri);
                      return true;
                  }

                  if (url.startsWith("https://japnishpaints.store/")) {
                      return false;
                  }

                  openExternal(uri);
                  return true;
              }

              @Override
              protected void onResume() {
                  super.onResume();

                  if (webView == null) return;

                  if (firstResume) {
                      firstResume = false;
                      return;
                  }

                  webView.clearCache(true);
                  webView.reload();
              }

              private void openApkExternal(Uri uri) {
                  try {
                      Intent intent = new Intent(Intent.ACTION_VIEW);
                      intent.setDataAndType(
                          uri,
                          "application/vnd.android.package-archive"
                      );
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      startActivity(intent);
                  } catch (Exception e) {
                      openExternal(uri);
                  }
              }

              private void openExternal(Uri uri) {
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, uri));
                  } catch (Exception ignored) {}
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(
                      requestCode, permissions, grantResults
                  );

                  if (requestCode != CAMERA_PERMISSION_REQUEST) return;

                  if (grantResults.length > 0
                          && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      if (pendingPermissionRequest != null) {
                          pendingPermissionRequest.grant(new String[]{
                              PermissionRequest.RESOURCE_VIDEO_CAPTURE
                          });
                          pendingPermissionRequest = null;
                      } else {
                          webView.reload();
                      }
                  } else {
                      if (pendingPermissionRequest != null) {
                          pendingPermissionRequest.deny();
                      }
                      pendingPermissionRequest = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) webView.destroy();
                  super.onDestroy();
              }
          }
          EOF

      - name: Restore signing keystore
        shell: bash
        env:
          JP_KEYSTORE_B64: ${{ secrets.JP_KEYSTORE_B64 }}
          JP_KEYSTORE_PASSWORD: ${{ secrets.JP_KEYSTORE_PASSWORD }}
          JP_KEY_ALIAS: ${{ secrets.JP_KEY_ALIAS }}
        run: |
          KEYSTORE_PATH="$GITHUB_WORKSPACE/japnishpaints-release-v2.jks"

          printf '%s' "$JP_KEYSTORE_B64" \
            | tr -d '[:space:]' \
            | base64 --decode --ignore-garbage \
            > "$KEYSTORE_PATH"

          test -s "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$JP_KEYSTORE_PASSWORD" \
            -alias "$JP_KEY_ALIAS" \
            > /dev/null

      - name: Build signed Release APK
        env:
          JP_KEYSTORE_PASSWORD: ${{ secrets.JP_KEYSTORE_PASSWORD }}
          JP_KEY_ALIAS: ${{ secrets.JP_KEY_ALIAS }}
          JP_KEY_PASSWORD: ${{ secrets.JP_KEY_PASSWORD }}
        run: |
          gradle --no-daemon clean assembleRelease

      - name: Verify APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          echo "APK generated:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JapnishPaints-Live-NewLogo
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
